name: Build and Update chess-dev

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: processing-chess-development-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Processing through Cloudflare cache
        shell: pwsh
        env:
          PROCESSING_CACHE_URL: ${{ secrets.PROCESSING_CACHE_URL }}
          PROCESSING_CACHE_SECRET: ${{ secrets.PROCESSING_CACHE_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROCESSING_CACHE_URL)) {
            throw "GitHub Actions secret PROCESSING_CACHE_URL is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PROCESSING_CACHE_SECRET)) {
            throw "GitHub Actions secret PROCESSING_CACHE_SECRET is missing."
          }

          $processingZip = Join-Path $env:RUNNER_TEMP "processing.zip"
          $processingDir = Join-Path $env:RUNNER_TEMP "processing-install"
          $workerUrl = $env:PROCESSING_CACHE_URL.TrimEnd("/")
          $headers = @{
            Authorization = "Bearer $env:PROCESSING_CACHE_SECRET"
          }

          Write-Host "Downloading Processing through Cloudflare Worker."

          Invoke-WebRequest `
            -Uri "$workerUrl/processing-windows" `
            -Headers $headers `
            -OutFile $processingZip

          if (-not (Test-Path $processingZip)) {
            throw "Processing ZIP was not downloaded."
          }

          if ((Get-Item $processingZip).Length -eq 0) {
            throw "Processing ZIP is empty."
          }

          if (Test-Path $processingDir) {
            Remove-Item $processingDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $processingDir -Force | Out-Null

          Expand-Archive `
            -Path $processingZip `
            -DestinationPath $processingDir `
            -Force

          Write-Host "Processing downloaded and extracted successfully."

          Write-Host "Available Processing executables:"
          Get-ChildItem `
            -Path $processingDir `
            -Include "processing-java.exe", "Processing.exe" `
            -File `
            -Recurse |
            Select-Object FullName

      - name: Install Processing Sound library through Cloudflare cache
        shell: pwsh
        env:
          PROCESSING_CACHE_URL: ${{ secrets.PROCESSING_CACHE_URL }}
          PROCESSING_CACHE_SECRET: ${{ secrets.PROCESSING_CACHE_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROCESSING_CACHE_URL)) {
            throw "GitHub Actions secret PROCESSING_CACHE_URL is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PROCESSING_CACHE_SECRET)) {
            throw "GitHub Actions secret PROCESSING_CACHE_SECRET is missing."
          }

          $workerUrl = $env:PROCESSING_CACHE_URL.TrimEnd("/")
          $soundZip = Join-Path $env:RUNNER_TEMP "sound.zip"
          $soundExtract = Join-Path $env:RUNNER_TEMP "sound-extracted"

          $headers = @{
            Authorization = "Bearer $env:PROCESSING_CACHE_SECRET"
          }

          Invoke-WebRequest `
            -Uri "$workerUrl/processing-sound" `
            -Headers $headers `
            -OutFile $soundZip

          if (-not (Test-Path $soundZip)) {
            throw "Processing Sound ZIP was not downloaded."
          }

          if ((Get-Item $soundZip).Length -eq 0) {
            throw "Processing Sound ZIP is empty."
          }

          if (Test-Path $soundExtract) {
            Remove-Item $soundExtract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $soundExtract -Force | Out-Null

          Expand-Archive `
            -Path $soundZip `
            -DestinationPath $soundExtract `
            -Force

          $soundLibrary = Get-ChildItem `
            -Path $soundExtract `
            -Directory `
            -Recurse |
            Where-Object {
              $_.Name -eq "sound" -and
              (Test-Path (Join-Path $_.FullName "library"))
            } |
            Select-Object -First 1

          if (-not $soundLibrary) {
            $soundLibrary = Get-ChildItem `
              -Path $soundExtract `
              -Directory `
              -Recurse |
              Where-Object {
                (Test-Path (Join-Path $_.FullName "library")) -and
                (Test-Path (Join-Path $_.FullName "library.properties"))
              } |
              Select-Object -First 1
          }

          if (-not $soundLibrary) {
            Write-Host "Extracted Sound library contents:"
            Get-ChildItem $soundExtract -Recurse |
              Select-Object FullName

            throw "Could not locate the extracted Processing Sound library."
          }

          $sketchbook = Join-Path $env:USERPROFILE "Documents\Processing"
          $libraries = Join-Path $sketchbook "libraries"
          $soundTarget = Join-Path $libraries "sound"

          New-Item -ItemType Directory -Path $libraries -Force | Out-Null

          if (Test-Path $soundTarget) {
            Remove-Item $soundTarget -Recurse -Force
          }

          New-Item -ItemType Directory -Path $soundTarget -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $soundLibrary.FullName "*") `
            -Destination $soundTarget `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $soundTarget "library"))) {
            throw "The Processing Sound library was not installed correctly."
          }

          Write-Host "Processing Sound library installed successfully."

      - name: Export Windows application
        shell: pwsh
        timeout-minutes: 10
        run: |
          $processingDir = Join-Path $env:RUNNER_TEMP "processing-install"

          $legacyCli = Get-ChildItem `
            -Path $processingDir `
            -Filter "processing-java.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          $modernCli = $null

          if (-not $legacyCli) {
            $modernCli = Get-ChildItem `
              -Path $processingDir `
              -Filter "Processing.exe" `
              -File `
              -Recurse |
              Select-Object -First 1
          }

          if (-not $legacyCli -and -not $modernCli) {
            Write-Host "Downloaded Processing files:"
            Get-ChildItem $processingDir -Recurse |
              Select-Object FullName

            throw "Could not find processing-java.exe or Processing.exe."
          }

          $sketchPath = $env:GITHUB_WORKSPACE
          $exportPath = Join-Path $env:RUNNER_TEMP "chess-export"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "processing-stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "processing-stderr.log"

          if (Test-Path $exportPath) {
            Remove-Item $exportPath -Recurse -Force
          }

          Remove-Item $stdoutPath, $stderrPath `
            -Force -ErrorAction SilentlyContinue

          $arguments = @()

          if ($legacyCli) {
            $cli = $legacyCli
          }
          else {
            $cli = $modernCli
            $arguments += "cli"
          }

          $arguments += "--sketch=$sketchPath"
          $arguments += "--output=$exportPath"
          $arguments += "--variant=windows-amd64"
          $arguments += "--force"
          $arguments += "--export"

          Write-Host "Processing executable: $($cli.FullName)"
          Write-Host "Sketch: $sketchPath"
          Write-Host "Export directory: $exportPath"
          Write-Host "Arguments: $($arguments -join ' ')"

          Write-Host "Processing version information:"
          if ($cli.Name -ieq "Processing.exe") {
            & $cli.FullName --help
            Write-Host "CLI help exit code: $LASTEXITCODE"
          }

          $process = Start-Process `
            -FilePath $cli.FullName `
            -ArgumentList $arguments `
            -WorkingDirectory $cli.Directory.FullName `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -Wait `
            -PassThru

          Write-Host "Processing exit code: $($process.ExitCode)"

          if (Test-Path $stdoutPath) {
            Write-Host "Processing standard output:"
            Get-Content $stdoutPath
          }

          if (Test-Path $stderrPath) {
            Write-Host "Processing error output:"
            Get-Content $stderrPath
          }

          if ($process.ExitCode -ne 0) {
            throw "Processing export failed with exit code $($process.ExitCode)."
          }

          $exportedExe = Get-ChildItem `
            -Path $exportPath `
            -Filter "processing-chess.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exportedExe) {
            throw "Processing exited successfully but processing-chess.exe was not found."
          }

          Write-Host "Export completed successfully: $($exportedExe.FullName)"

      - name: Package Windows application
        shell: pwsh
        run: |
          $exportPath = Join-Path $env:RUNNER_TEMP "chess-export"
          $archive = Join-Path $env:GITHUB_WORKSPACE "chess-windows.zip"

          $appExe = Get-ChildItem `
            -Path $exportPath `
            -Recurse `
            -File `
            -Filter "processing-chess.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $appExe) {
            throw "The exported Windows executable could not be found."
          }

          $buildVersion = "1.0.0-dev.$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_RUN_ATTEMPT)"
          $builtAt = [DateTime]::UtcNow.ToString("o")
          $buildInfo = Join-Path $exportPath ".build-info.txt"

          @(
            "channel=chess-dev"
            "version=$buildVersion"
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_RUN_NUMBER"
            "attempt=$env:GITHUB_RUN_ATTEMPT"
            "built_utc=$builtAt"
          ) | Set-Content -Path $buildInfo -Encoding utf8

          Write-Host "Internal build version: $buildVersion"
          Write-Host "Executable: $($appExe.FullName)"
          Write-Host "Packaging the complete export directory."

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Compress-Archive `
            -Path (Join-Path $exportPath "*") `
            -DestinationPath $archive `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $archive)) {
            throw "Failed to create chess-windows.zip."
          }

          Write-Host "Created archive:"
          Get-Item $archive | Select-Object FullName, Length

      - name: Update chess-dev release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "chess-windows.zip"
          $buildVersion = "1.0.0-dev.$($env:GITHUB_RUN_NUMBER).$($env:GITHUB_RUN_ATTEMPT)"

          if (-not (Test-Path $archive)) {
            throw "Release archive does not exist."
          }

          $notes = @"
          Automated development build of Processing Chess.

          Download chess-windows.zip for the latest build. This development version may contain bugs.

          <!-- internal-version: $buildVersion; commit: $env:GITHUB_SHA -->
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes | Set-Content -Path $notesPath -Encoding utf8

          Write-Host "Updating fixed tag chess-dev to $env:GITHUB_SHA"

          git tag -f chess-dev $env:GITHUB_SHA

          if ($LASTEXITCODE -ne 0) {
            throw "Could not update the local chess-dev tag."
          }

          git push origin refs/tags/chess-dev --force

          if ($LASTEXITCODE -ne 0) {
            throw "Could not update the remote chess-dev tag."
          }

          gh release view chess-dev `
            --repo $env:GITHUB_REPOSITORY `
            *> $null

          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            Write-Host "Replacing the existing chess-dev asset."

            gh release upload chess-dev $archive `
              --repo $env:GITHUB_REPOSITORY `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace the chess-windows.zip asset."
            }

            gh release edit chess-dev `
              --repo $env:GITHUB_REPOSITORY `
              --title "chess-dev" `
              --notes-file $notesPath `
              --prerelease

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update the chess-dev release."
            }
          }
          else {
            Write-Host "Creating the initial chess-dev release."

            gh release create chess-dev $archive `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "chess-dev" `
              --notes-file $notesPath `
              --prerelease `
              --verify-tag

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the chess-dev release."
            }
          }

          Write-Host "Successfully published the latest chess-dev build."
