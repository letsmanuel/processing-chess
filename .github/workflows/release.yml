
name: Build and Release Chess

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-development-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Processing
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/processing/processing4/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match '^processing-.*-windows-x64\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find the Windows x64 Processing ZIP."
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile processing.zip
          Expand-Archive processing.zip -DestinationPath processing -Force

      - name: Install Processing Sound library
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/processing/processing-sound/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -eq "sound.zip" } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find sound.zip in the Processing Sound release."
          }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sound.zip
          Expand-Archive sound.zip -DestinationPath sound-extracted -Force

          $sound = Get-ChildItem sound-extracted -Directory -Recurse |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "library")) -or
              (Test-Path (Join-Path $_.FullName "library.properties"))
            } |
            Select-Object -First 1

          if (-not $sound) {
            throw "Could not locate the Sound library."
          }

          $sketchbook = Join-Path $env:USERPROFILE "Documents\Processing"
          $libraries = Join-Path $sketchbook "libraries"
          New-Item -ItemType Directory -Force -Path $libraries | Out-Null

          Copy-Item $sound.FullName (Join-Path $libraries "sound") -Recurse -Force

          "PROCESSING_SKETCHBOOK=$sketchbook" >> $env:GITHUB_ENV

      - name: Export Processing sketch
        shell: pwsh
        run: |
          $cli = Get-ChildItem processing -Recurse -Filter processing-java.exe |
            Select-Object -First 1

          if (-not $cli) {
            throw "Could not locate processing-java.exe."
          }

          $sketch = $env:GITHUB_WORKSPACE
          $output = Join-Path $env:GITHUB_WORKSPACE "build\export"

          New-Item -ItemType Directory -Force -Path $output | Out-Null

          & $cli.FullName `
            "--sketch=$sketch" `
            "--output=$output" `
            --force `
            --export

          if ($LASTEXITCODE -ne 0) {
            throw "Processing export failed."
          }

      - name: Package Windows application
        shell: pwsh
        run: |
          $export = Join-Path $env:GITHUB_WORKSPACE "build\export"

          $exe = Get-ChildItem $export -Recurse -Filter "*.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "No executable was produced by the export."
          }

          Compress-Archive `
            -Path "$($exe.Directory.FullName)\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\chess-windows.zip" `
            -Force

      - name: Generate development version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list `
            --repo "${{ github.repository }}" `
            --limit 100 `
            --json tagName

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve existing releases."
          }

          $numbers = @(
            ($releases | ConvertFrom-Json) |
              ForEach-Object {
                if ($_.tagName -match '^dev-(\d+)$') {
                  [int]$Matches[1]
                }
              }
          )

          $next = 1
          if ($numbers.Count -gt 0) {
            $next = ($numbers | Measure-Object -Maximum).Maximum + 1
          }

          "version=dev-$next" >> $env:GITHUB_OUTPUT

      - name: Publish development release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Chess ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: chess-windows.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
