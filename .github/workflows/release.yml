
name: Build and Release Chess

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: processing-chess-development-releases
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Processing
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/processing/processing4/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -match 'windows-x64.*portable\.zip$' } |
            Select-Object -First 1

          if (-not $asset) {
            $asset = $release.assets |
              Where-Object { $_.name -match 'windows-x64.*\.zip$' } |
              Select-Object -First 1
          }

          if (-not $asset) {
            Write-Host "Available Processing assets:"
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Could not find the Windows x64 Processing ZIP."
          }

          $processingZip = Join-Path $env:RUNNER_TEMP "processing.zip"
          $processingDir = Join-Path $env:RUNNER_TEMP "processing-install"

          Write-Host "Downloading $($asset.name)"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $processingZip

          if (Test-Path $processingDir) {
            Remove-Item $processingDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $processingDir -Force | Out-Null

          Expand-Archive `
            -Path $processingZip `
            -DestinationPath $processingDir `
            -Force

      - name: Install Processing Sound library
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/processing/processing-sound/releases/latest"

          $asset = $release.assets |
            Where-Object { $_.name -eq "sound.zip" } |
            Select-Object -First 1

          if (-not $asset) {
            Write-Host "Available Sound assets:"
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Could not find sound.zip in the official Processing Sound release."
          }

          $soundZip = Join-Path $env:RUNNER_TEMP "sound.zip"
          $soundExtract = Join-Path $env:RUNNER_TEMP "sound-extracted"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $soundZip

          if (Test-Path $soundExtract) {
            Remove-Item $soundExtract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $soundExtract -Force | Out-Null

          Expand-Archive `
            -Path $soundZip `
            -DestinationPath $soundExtract `
            -Force

          $soundLibrary = Get-ChildItem `
            -Path $soundExtract `
            -Directory `
            -Recurse |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "library")) -and
              (Test-Path (Join-Path $_.FullName "library.properties"))
            } |
            Select-Object -First 1

          if (-not $soundLibrary) {
            Write-Host "Extracted Sound library contents:"
            Get-ChildItem $soundExtract -Recurse |
              Select-Object FullName

            throw "Could not locate the Processing Sound library."
          }

          $sketchbook = Join-Path $env:USERPROFILE "Documents\Processing"
          $libraries = Join-Path $sketchbook "libraries"
          $soundTarget = Join-Path $libraries "sound"

          New-Item -ItemType Directory -Path $libraries -Force | Out-Null

          if (Test-Path $soundTarget) {
            Remove-Item $soundTarget -Recurse -Force
          }

          New-Item -ItemType Directory -Path $soundTarget -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $soundLibrary.FullName "*") `
            -Destination $soundTarget `
            -Recurse `
            -Force

          if (-not (Test-Path (Join-Path $soundTarget "library"))) {
            throw "Sound library installation failed."
          }

          Write-Host "Processing Sound library installed successfully."

      - name: Export Windows application
        shell: pwsh
        run: |
          $processingDir = Join-Path $env:RUNNER_TEMP "processing-install"

          $cli = Get-ChildItem `
            -Path $processingDir `
            -Filter "Processing.exe" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $cli) {
            $cli = Get-ChildItem `
              -Path $processingDir `
              -Filter "processing-java.exe" `
              -File `
              -Recurse |
              Select-Object -First 1
          }

          if (-not $cli) {
            Write-Host "Downloaded Processing files:"
            Get-ChildItem $processingDir -Recurse |
              Select-Object FullName

            throw "Could not find the Processing executable."
          }

          $sketchPath = $env:GITHUB_WORKSPACE
          $exportPath = Join-Path $env:RUNNER_TEMP "chess-export"
          $logPath = Join-Path $env:RUNNER_TEMP "processing-export.log"

          if (Test-Path $exportPath) {
            Remove-Item $exportPath -Recurse -Force
          }

          New-Item -ItemType Directory -Path $exportPath -Force | Out-Null

          Write-Host "Processing executable: $($cli.FullName)"
          Write-Host "Sketch: $sketchPath"
          Write-Host "Export directory: $exportPath"

          $arguments = @()

          if ($cli.Name -ieq "Processing.exe") {
            $arguments += "cli"
          }

          $arguments += "--sketch=$sketchPath"
          $arguments += "--output=$exportPath"
          $arguments += "--variant=windows-amd64"
          $arguments += "--force"
          $arguments += "--export"

          & $cli.FullName @arguments 2>&1 |
            Tee-Object -FilePath $logPath

          $processingExitCode = $LASTEXITCODE

          Write-Host "Processing exit code: $processingExitCode"

          $exportedExe = Get-ChildItem `
            -Path $exportPath `
            -Recurse `
            -File `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ieq "processing-chess.exe"
            } |
            Select-Object -First 1

          if (-not $exportedExe) {
            $exportedExe = Get-ChildItem `
              -Path $exportPath `
              -File `
              -Filter "*.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $exportedExe) {
            Write-Host "No Windows executable was found."
            Write-Host "Files produced by Processing:"

            if (Test-Path $exportPath) {
              Get-ChildItem `
                -Path $exportPath `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue |
                Select-Object FullName, Length |
                Format-Table -AutoSize
            }

            Write-Host "Processing log:"
            if (Test-Path $logPath) {
              Get-Content $logPath
            }

            throw "Processing did not produce a Windows executable."
          }

          if ($processingExitCode -ne 0) {
            Write-Warning "Processing returned exit code $processingExitCode, but an executable exists. Inspect the exported files and log before treating the application as verified."
          }

          Write-Host "Found executable: $($exportedExe.FullName)"

          Write-Host "Complete export contents:"
          Get-ChildItem `
            -Path $exportPath `
            -Recurse `
            -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Package Windows application
        shell: pwsh
        run: |
          $exportPath = Join-Path $env:RUNNER_TEMP "chess-export"
          $archive = Join-Path $env:GITHUB_WORKSPACE "chess-windows.zip"

          if (-not (Test-Path $exportPath)) {
            throw "The Processing export directory does not exist."
          }

          $files = Get-ChildItem `
            -Path $exportPath `
            -Recurse `
            -File

          if (-not ($files | Where-Object { $_.Extension -ieq ".exe" })) {
            throw "The export contains no executable."
          }

          if ($files.Count -eq 0) {
            throw "The Processing export is empty."
          }

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Write-Host "Packaging the entire exported application."

          Compress-Archive `
            -Path (Join-Path $exportPath "*") `
            -DestinationPath $archive `
            -CompressionLevel Optimal `
            -Force

          if (-not (Test-Path $archive)) {
            throw "Failed to create chess-windows.zip."
          }

          Write-Host "Created release archive:"
          Get-Item $archive |
            Select-Object FullName, Length

      - name: Publish development release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $refs = git ls-remote --tags origin "refs/tags/dev-*"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve existing development tags."
          }

          $numbers = @(
            $refs | ForEach-Object {
              $parts = $_ -split '\s+'

              if ($parts.Length -ge 2) {
                $tag = $parts[1] -replace '\^\{\}$', ''

                if ($tag -match '^refs/tags/dev-(\d+)$') {
                  [int]$Matches[1]
                }
              }
            }
          )

          $next = 1

          if ($numbers.Count -gt 0) {
            $next = ($numbers | Measure-Object -Maximum).Maximum + 1
          }

          $version = "dev-$next"
          $archive = Join-Path $env:GITHUB_WORKSPACE "chess-windows.zip"

          if (-not (Test-Path $archive)) {
            throw "Release archive does not exist: $archive"
          }

          Write-Host "Publishing development release $version"

          gh release create $version $archive `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Chess $version" `
            --generate-notes `
            --prerelease

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub development release $version."
          }
